<!-- Modal de Pódio Oficial & Campeões (Por Modalidade e Campeão Geral) -->
<div id="podium-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-xs flex items-center justify-center p-2.5 sm:p-5 transition-all duration-300 opacity-0 pointer-events-none hidden" style="display: none !important;" onclick="fecharModalPodium(event)">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl max-w-4xl w-full max-h-[92vh] flex flex-col overflow-hidden text-slate-100 transform scale-95 transition-all duration-300" onclick="event.stopPropagation()">
        
        <!-- Cabeçalho do Modal -->
        <div class="p-4 sm:p-6 border-b border-slate-800/80 flex items-center justify-between gap-4 bg-slate-950/60 shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-2xl bg-amber-500/20 border border-amber-500/40 text-amber-400 flex items-center justify-center shrink-0 shadow-inner">
                    <i data-lucide="trophy" class="w-5 h-5 sm:w-6 sm:h-6"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <span class="text-[10px] font-black uppercase tracking-widest text-amber-400">Olimpíadas Universitárias</span>
                        <span id="podium-total-badge" class="px-2 py-0.2 rounded-full text-[9px] font-bold bg-slate-800 text-slate-300 border border-slate-700">Carregando...</span>
                    </div>
                    <h2 class="text-base sm:text-xl font-black text-white tracking-tight">Pódio & Quadro de Campeões</h2>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button type="button" onclick="carregarDadosPodium(true)" class="w-8 h-8 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition cursor-pointer" title="Atualizar dados">
                    <i data-lucide="refresh-cw" class="w-4 h-4" id="podium-refresh-icon"></i>
                </button>
                <a href="{% url 'chaveamento_podium' %}" target="_blank" class="w-8 h-8 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition cursor-pointer" title="Abrir página completa / Imprimir">
                    <i data-lucide="external-link" class="w-4 h-4"></i>
                </a>
                <button type="button" onclick="fecharModalPodium()" class="w-8 h-8 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition cursor-pointer" title="Fechar">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
        </div>

        <!-- Barra de Abas e Filtros -->
        <div class="p-3 sm:p-4 bg-slate-950/40 border-b border-slate-800/80 space-y-3 shrink-0">
            <!-- Alternador de Visão Principal: Por Modalidade vs Campeão Geral -->
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
                <div class="inline-flex p-1 bg-slate-950 rounded-2xl border border-slate-800 shadow-inner">
                    <button type="button" id="tab-btn-modalidades" onclick="alternarAbaPodium('modalidades')" class="px-3.5 sm:px-4 py-1.5 rounded-xl text-xs font-black transition flex items-center justify-center gap-2 bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 shadow-sm cursor-pointer">
                        <i data-lucide="trophy" class="w-3.5 h-3.5"></i>
                        <span>Por Modalidade</span>
                    </button>
                    <button type="button" id="tab-btn-geral" onclick="alternarAbaPodium('geral')" class="px-3.5 sm:px-4 py-1.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 text-slate-400 hover:text-white cursor-pointer">
                        <i data-lucide="crown" class="w-3.5 h-3.5"></i>
                        <span>Campeão Geral</span>
                    </button>
                </div>

                <!-- Campo de Busca em Tempo Real -->
                <div class="relative flex-1 sm:max-w-xs">
                    <i data-lucide="search" class="w-3.5 h-3.5 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                    <input type="text" id="podium-search-input" oninput="aplicarFiltrosPodium()" placeholder="Buscar modalidade..." class="w-full pl-9 pr-3 py-1.5 text-xs bg-slate-950 border border-slate-800 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-amber-500/50 focus:border-amber-500/50">
                </div>
            </div>

            <!-- Filtros Específicos para a aba 'Por Modalidade' -->
            <div id="podium-modalidades-filters" class="flex flex-wrap items-center gap-2 pt-1 text-[11px]">
                <span class="text-slate-400 font-semibold mr-1 hidden sm:inline">Gênero:</span>
                <button type="button" onclick="filtrarGeneroPodium('TODOS')" class="podium-genero-btn px-2.5 py-1 rounded-lg font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40 cursor-pointer" data-genero="TODOS">Todos</button>
                <button type="button" onclick="filtrarGeneroPodium('M')" class="podium-genero-btn px-2.5 py-1 rounded-lg font-semibold bg-slate-800 text-slate-400 hover:text-white border border-slate-700/60 cursor-pointer" data-genero="M">Masculino</button>
                <button type="button" onclick="filtrarGeneroPodium('F')" class="podium-genero-btn px-2.5 py-1 rounded-lg font-semibold bg-slate-800 text-slate-400 hover:text-white border border-slate-700/60 cursor-pointer" data-genero="F">Feminino</button>
                <button type="button" onclick="filtrarGeneroPodium('Misto')" class="podium-genero-btn px-2.5 py-1 rounded-lg font-semibold bg-slate-800 text-slate-400 hover:text-white border border-slate-700/60 cursor-pointer" data-genero="Misto">Misto</button>

                <div class="h-4 w-px bg-slate-800 mx-1 hidden sm:block"></div>

                <span class="text-slate-400 font-semibold mr-1 hidden sm:inline">Status:</span>
                <button type="button" onclick="filtrarStatusPodium('TODOS')" class="podium-status-btn px-2.5 py-1 rounded-lg font-bold bg-slate-700 text-white border border-slate-600 cursor-pointer" data-status="TODOS">Todos</button>
                <button type="button" onclick="filtrarStatusPodium('finalizado')" class="podium-status-btn px-2.5 py-1 rounded-lg font-semibold bg-slate-800 text-slate-400 hover:text-white border border-slate-700/60 cursor-pointer" data-status="finalizado">Concluídos</button>
                <button type="button" onclick="filtrarStatusPodium('em_andamento')" class="podium-status-btn px-2.5 py-1 rounded-lg font-semibold bg-slate-800 text-slate-400 hover:text-white border border-slate-700/60 cursor-pointer" data-status="em_andamento">Em Andamento</button>
            </div>
        </div>

        <!-- Conteúdo do Modal (Scrollável) -->
        <div id="podium-content-area" class="p-4 sm:p-6 overflow-y-auto flex-1 space-y-6">
            <!-- Spinner Inicial -->
            <div id="podium-loading" class="flex flex-col items-center justify-center py-16 space-y-3">
                <div class="w-8 h-8 border-3 border-amber-500 border-t-transparent rounded-full animate-spin"></div>
                <p class="text-xs text-slate-400 font-medium">Carregando classificação e pódios...</p>
            </div>

            <!-- Visualização 1: Lista de Pódios por Modalidade -->
            <div id="podium-view-modalidades" class="space-y-6 hidden">
                <!-- Inserido dinamicamente via JavaScript -->
            </div>

            <!-- Visualização 2: Campeão Geral & Quadro de Medalhas -->
            <div id="podium-view-geral" class="space-y-6 hidden">
                <!-- Inserido dinamicamente via JavaScript -->
            </div>

            <!-- Estado Vazio / Sem Resultados -->
            <div id="podium-empty-state" class="hidden flex-col items-center justify-center py-12 text-center space-y-3">
                <div class="w-12 h-12 rounded-2xl bg-slate-800 flex items-center justify-center text-slate-500">
                    <i data-lucide="inbox" class="w-6 h-6"></i>
                </div>
                <p class="text-sm font-bold text-slate-300">Nenhum resultado encontrado</p>
                <p class="text-xs text-slate-500 max-w-sm">Tente ajustar os filtros ou o termo pesquisado.</p>
            </div>
        </div>

        <!-- Rodapé do Modal -->
        <div class="p-3 sm:p-4 bg-slate-950/80 border-t border-slate-800 flex items-center justify-between gap-4 text-xs text-slate-400 shrink-0">
            <span class="text-[11px] text-slate-500 hidden sm:inline">Atualizado automaticamente conforme o encerramento dos jogos.</span>
            <div class="flex items-center gap-2 ml-auto">
                <a href="{% url 'chaveamento_podium' %}" target="_blank" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-semibold transition flex items-center gap-1.5 cursor-pointer">
                    <i data-lucide="printer" class="w-3.5 h-3.5 text-slate-400"></i>
                    <span>Tela Cheia / Imprimir</span>
                </a>
                <button type="button" onclick="fecharModalPodium()" class="px-4 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold transition cursor-pointer">
                    Fechar
                </button>
            </div>
        </div>

    </div>
</div>

<script>
(function() {
    let podiumCache = null;
    let abaAtual = 'modalidades';
    let filtroGenero = 'TODOS';
    let filtroStatus = 'TODOS';
    let termoBusca = '';
    let modalidadeFocoId = null;

    window.abrirModalPodium = function(modalidadeId = null) {
        const isPublic = window.location.pathname.includes('/compartilhar');
        let targetUrl = isPublic ? "{% url 'chaveamento_share_podium' %}" : "{% url 'chaveamento_podium' %}";
        const params = [];
        if (modalidadeId) {
            params.push('mod=' + encodeURIComponent(modalidadeId));
        }
        if (window.location.pathname) {
            params.push('voltar=' + encodeURIComponent(window.location.pathname + window.location.search));
        }
        if (params.length > 0) {
            targetUrl += '?' + params.join('&');
        }
        window.location.href = targetUrl;
    };

    window.fecharModalPodium = function(e) {
        if (e && e.target && e.target.id !== 'podium-modal') return;
        const modal = document.getElementById('podium-modal');
        if (!modal) return;

        modal.classList.add('opacity-0', 'pointer-events-none');
        modal.classList.remove('opacity-100');
        const card = modal.querySelector('div');
        if (card) {
            card.classList.add('scale-95');
            card.classList.remove('scale-100');
        }
    };

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            const modal = document.getElementById('podium-modal');
            if (modal && !modal.classList.contains('pointer-events-none')) {
                fecharModalPodium();
            }
        }
    });

    window.alternarAbaPodium = function(aba) {
        abaAtual = aba;
        const btnMod = document.getElementById('tab-btn-modalidades');
        const btnGeral = document.getElementById('tab-btn-geral');
        const filtersMod = document.getElementById('podium-modalidades-filters');
        const searchInput = document.getElementById('podium-search-input');

        if (aba === 'modalidades') {
            btnMod.className = 'px-3.5 sm:px-4 py-1.5 rounded-xl text-xs font-black transition flex items-center justify-center gap-2 bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 shadow-sm cursor-pointer';
            btnGeral.className = 'px-3.5 sm:px-4 py-1.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 text-slate-400 hover:text-white cursor-pointer';
            if (filtersMod) filtersMod.classList.remove('hidden');
            if (searchInput) searchInput.placeholder = 'Buscar modalidade (ex: Futsal, Vôlei)...';
        } else {
            btnGeral.className = 'px-3.5 sm:px-4 py-1.5 rounded-xl text-xs font-black transition flex items-center justify-center gap-2 bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 shadow-sm cursor-pointer';
            btnMod.className = 'px-3.5 sm:px-4 py-1.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 text-slate-400 hover:text-white cursor-pointer';
            if (filtersMod) filtersMod.classList.add('hidden');
            if (searchInput) searchInput.placeholder = 'Buscar delegação no quadro...';
        }

        renderizarPodium();
    };

    window.filtrarGeneroPodium = function(genero) {
        filtroGenero = genero;
        document.querySelectorAll('.podium-genero-btn').forEach(btn => {
            if (btn.dataset.genero === genero) {
                btn.className = 'podium-genero-btn px-2.5 py-1 rounded-lg font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40 cursor-pointer';
            } else {
                btn.className = 'podium-genero-btn px-2.5 py-1 rounded-lg font-semibold bg-slate-800 text-slate-400 hover:text-white border border-slate-700/60 cursor-pointer';
            }
        });
        renderizarPodium();
    };

    window.filtrarStatusPodium = function(status) {
        filtroStatus = status;
        document.querySelectorAll('.podium-status-btn').forEach(btn => {
            if (btn.dataset.status === status) {
                btn.className = 'podium-status-btn px-2.5 py-1 rounded-lg font-bold bg-slate-700 text-white border border-slate-600 cursor-pointer';
            } else {
                btn.className = 'podium-status-btn px-2.5 py-1 rounded-lg font-semibold bg-slate-800 text-slate-400 hover:text-white border border-slate-700/60 cursor-pointer';
            }
        });
        renderizarPodium();
    };

    window.aplicarFiltrosPodium = function() {
        const input = document.getElementById('podium-search-input');
        termoBusca = (input ? input.value : '').toLowerCase().trim();
        renderizarPodium();
    };

    window.carregarDadosPodium = function(animarIcone = false) {
        const loading = document.getElementById('podium-loading');
        const viewMod = document.getElementById('podium-view-modalidades');
        const viewGeral = document.getElementById('podium-view-geral');
        const emptyState = document.getElementById('podium-empty-state');
        const refreshIcon = document.getElementById('podium-refresh-icon');

        if (animarIcone && refreshIcon) {
            refreshIcon.classList.add('animate-spin');
        }
        if (loading) loading.classList.remove('hidden');
        if (viewMod) viewMod.classList.add('hidden');
        if (viewGeral) viewGeral.classList.add('hidden');
        if (emptyState) emptyState.classList.add('hidden');

        fetch('/api/podium/')
            .then(res => res.json())
            .then(data => {
                podiumCache = data;
                const badge = document.getElementById('podium-total-badge');
                if (badge && data.campeao_geral) {
                    badge.textContent = `${data.campeao_geral.total_finalizadas}/${data.campeao_geral.total_modalidades} Concluídas`;
                }
                renderizarPodium();
            })
            .catch(err => {
                console.error("Erro ao carregar pódio:", err);
                if (loading) {
                    loading.innerHTML = `
                        <div class="text-center py-8 text-rose-400">
                            <i data-lucide="alert-circle" class="w-8 h-8 mx-auto mb-2"></i>
                            <p class="text-sm font-bold">Erro ao carregar dados do pódio.</p>
                            <button onclick="carregarDadosPodium(true)" class="mt-3 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-bold">Tentar novamente</button>
                        </div>
                    `;
                    if (window.lucide) window.lucide.createIcons();
                }
            })
            .finally(() => {
                if (animarIcone && refreshIcon) {
                    setTimeout(() => refreshIcon.classList.remove('animate-spin'), 400);
                }
            });
    };

    function gerarAvatarHtml(equipe, sizeClass = "w-10 h-10 text-xs", ringColor = "ring-slate-700") {
        if (!equipe) {
            return `
                <div class="${sizeClass} rounded-full bg-slate-800/80 border-2 border-dashed border-slate-600 flex items-center justify-center text-slate-500 shadow-inner">
                    <i data-lucide="help-circle" class="w-4 h-4"></i>
                </div>
            `;
        }
        if (equipe.foto_url) {
            return `<img src="${equipe.foto_url}" alt="${equipe.nome}" class="${sizeClass} rounded-full object-cover border-2 shadow-md ring-2 ${ringColor}">`;
        }
        const initials = (equipe.nome || '?').split(' ').filter(Boolean).slice(0, 2).map(p => p[0].toUpperCase()).join('');
        return `
            <div class="${sizeClass} rounded-full bg-gradient-to-br from-slate-700 to-slate-900 border-2 border-slate-600 shadow-md ring-2 ${ringColor} flex items-center justify-center font-black text-amber-300">
                ${initials || '?'}
            </div>
        `;
    }

    function renderizarPodiumVisual(primeiro, segundo, terceiro, isGeral = false) {
        return `
            <div class="relative w-full max-w-lg mx-auto flex items-end justify-center gap-2 sm:gap-4 pt-6 pb-1 select-none">
                
                <!-- 2º LUGAR (PRATA - ESQUERDA) -->
                <div class="flex-1 flex flex-col items-center min-w-0 z-10">
                    <div class="flex flex-col items-center text-center mb-2 px-1 w-full">
                        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[9px] font-black uppercase tracking-wider bg-slate-200 text-slate-800 border border-slate-300 shadow-xs mb-1.5">
                            🥈 2º Lugar
                        </span>
                        ${gerarAvatarHtml(segundo, "w-10 h-10 sm:w-12 sm:h-12 text-xs", "ring-slate-300")}
                        <span class="mt-1.5 text-xs font-black text-slate-200 max-w-full truncate leading-tight block">
                            ${segundo ? segundo.nome : '<span class="text-slate-500 font-normal italic">A definir</span>'}
                        </span>
                        ${segundo && segundo.campus ? `<span class="text-[9px] text-slate-400 font-medium truncate block">${segundo.campus}</span>` : ''}
                        ${isGeral && segundo ? `
                            <span class="mt-0.5 text-[10px] font-bold text-amber-300/90 block">
                                🥇 ${segundo.ouros} • 🥈 ${segundo.pratas} • 🥉 ${segundo.bronzes}
                            </span>
                        ` : ''}
                    </div>
                    <!-- Pedestal 2 -->
                    <div class="w-full ${segundo ? 'bg-gradient-to-t from-slate-600 via-slate-500 to-slate-400 border-t-2 border-slate-200 shadow-lg' : 'bg-slate-800/40 border-2 border-dashed border-slate-700 text-slate-600'} rounded-t-2xl flex flex-col items-center justify-center" style="height: 72px; min-height: 72px;">
                        <span class="text-2xl sm:text-3xl font-black ${segundo ? 'text-slate-900/80 drop-shadow-xs' : 'text-slate-600'}">2</span>
                        <span class="text-[9px] font-black uppercase tracking-widest ${segundo ? 'text-slate-900/70' : 'text-slate-600'}">Prata</span>
                    </div>
                </div>

                <!-- 1º LUGAR (OURO - CENTRO - MAIS ALTO) -->
                <div class="flex-1 flex flex-col items-center min-w-0 z-20 -mx-1">
                    <div class="flex flex-col items-center text-center mb-2 px-1 w-full">
                        <div class="relative">
                            <span class="text-base sm:text-lg absolute -top-4 -left-1 transform -rotate-12 animate-pulse">👑</span>
                            <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider bg-amber-400 text-slate-950 border border-amber-300 shadow-md mb-1.5">
                                🥇 Campeão
                            </span>
                        </div>
                        ${gerarAvatarHtml(primeiro, "w-12 h-12 sm:w-14 sm:h-14 text-sm", "ring-amber-400 ring-offset-2 ring-offset-slate-900 shadow-amber-500/20 shadow-lg")}
                        <span class="mt-1.5 text-xs sm:text-sm font-black text-amber-300 max-w-full truncate leading-tight block">
                            ${primeiro ? primeiro.nome : '<span class="text-slate-500 font-normal italic">A definir</span>'}
                        </span>
                        ${primeiro && primeiro.campus ? `<span class="text-[10px] text-amber-200/70 font-semibold truncate block">${primeiro.campus}</span>` : ''}
                        ${isGeral && primeiro ? `
                            <span class="mt-0.5 text-[10px] font-extrabold text-amber-400 block">
                                🥇 ${primeiro.ouros} • 🥈 ${primeiro.pratas} • 🥉 ${primeiro.bronzes}
                            </span>
                        ` : ''}
                    </div>
                    <!-- Pedestal 1 -->
                    <div class="w-full ${primeiro ? 'bg-gradient-to-t from-amber-600 via-amber-500 to-amber-300 border-t-3 border-yellow-100 shadow-amber-500/30 shadow-xl' : 'bg-slate-800/40 border-2 border-dashed border-slate-700 text-slate-600'} rounded-t-2xl flex flex-col items-center justify-center" style="height: 104px; min-height: 104px;">
                        <span class="text-3xl sm:text-4xl font-black ${primeiro ? 'text-amber-950 drop-shadow-xs' : 'text-slate-600'}">1</span>
                        <span class="text-[10px] font-black uppercase tracking-widest ${primeiro ? 'text-amber-950/80' : 'text-slate-600'}">Ouro</span>
                    </div>
                </div>

                <!-- 3º LUGAR (BRONZE - DIREITA) -->
                <div class="flex-1 flex flex-col items-center min-w-0 z-10">
                    <div class="flex flex-col items-center text-center mb-2 px-1 w-full">
                        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[9px] font-black uppercase tracking-wider bg-amber-800/90 text-amber-200 border border-amber-600/50 shadow-xs mb-1.5">
                            🥉 3º Lugar
                        </span>
                        ${gerarAvatarHtml(terceiro, "w-9 h-9 sm:w-11 sm:h-11 text-xs", "ring-amber-700")}
                        <span class="mt-1.5 text-xs font-black text-slate-300 max-w-full truncate leading-tight block">
                            ${terceiro ? terceiro.nome : '<span class="text-slate-500 font-normal italic">A definir</span>'}
                        </span>
                        ${terceiro && terceiro.campus ? `<span class="text-[9px] text-slate-400 font-medium truncate block">${terceiro.campus}</span>` : ''}
                        ${isGeral && terceiro ? `
                            <span class="mt-0.5 text-[10px] font-bold text-amber-300/80 block">
                                🥇 ${terceiro.ouros} • 🥈 ${terceiro.pratas} • 🥉 ${terceiro.bronzes}
                            </span>
                        ` : ''}
                    </div>
                    <!-- Pedestal 3 -->
                    <div class="w-full ${terceiro ? 'bg-gradient-to-t from-amber-900 via-amber-800 to-amber-700 border-t-2 border-amber-500 shadow-md' : 'bg-slate-800/40 border-2 border-dashed border-slate-700 text-slate-600'} rounded-t-2xl flex flex-col items-center justify-center" style="height: 48px; min-height: 48px;">
                        <span class="text-xl sm:text-2xl font-black ${terceiro ? 'text-amber-200/90 drop-shadow-xs' : 'text-slate-600'}">3</span>
                        <span class="text-[8px] font-black uppercase tracking-widest ${terceiro ? 'text-amber-200/70' : 'text-slate-600'}">Bronze</span>
                    </div>
                </div>

            </div>
        `;
    }

    function renderizarPodium() {
        if (!podiumCache) return;

        const loading = document.getElementById('podium-loading');
        const viewMod = document.getElementById('podium-view-modalidades');
        const viewGeral = document.getElementById('podium-view-geral');
        const emptyState = document.getElementById('podium-empty-state');

        if (loading) loading.classList.add('hidden');

        if (abaAtual === 'modalidades') {
            if (viewGeral) viewGeral.classList.add('hidden');
            if (viewMod) viewMod.classList.remove('hidden');

            let lista = podiumCache.modalidades || [];

            // Aplica filtros
            if (filtroGenero !== 'TODOS') {
                lista = lista.filter(m => m.genero === filtroGenero || (filtroGenero === 'Misto' && m.genero_display === 'Misto'));
            }
            if (filtroStatus !== 'TODOS') {
                lista = lista.filter(m => m.status === filtroStatus);
            }
            if (termoBusca) {
                lista = lista.filter(m => m.nome.toLowerCase().includes(termoBusca) || m.genero_display.toLowerCase().includes(termoBusca));
            }

            if (lista.length === 0) {
                if (viewMod) viewMod.innerHTML = '';
                if (emptyState) emptyState.classList.remove('hidden');
                return;
            }
            if (emptyState) emptyState.classList.add('hidden');

            let html = '';
            lista.forEach(m => {
                const statusColor = m.status === 'finalizado' ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40' : (m.status === 'em_andamento' ? 'bg-blue-500/20 text-blue-300 border-blue-500/40' : 'bg-slate-800 text-slate-400 border-slate-700');
                const statusIcon = m.status === 'finalizado' ? '<i data-lucide="check-circle-2" class="w-3 h-3 text-emerald-400 inline"></i>' : (m.status === 'em_andamento' ? '<i data-lucide="activity" class="w-3 h-3 text-blue-400 inline"></i>' : '<i data-lucide="clock" class="w-3 h-3 text-slate-500 inline"></i>');
                const isFoco = modalidadeFocoId && String(m.modalidade_id) === String(modalidadeFocoId);

                html += `
                    <div class="bg-slate-950/80 border ${isFoco ? 'border-amber-500 ring-2 ring-amber-500/30' : 'border-slate-800/90'} rounded-3xl p-4 sm:p-6 shadow-md transition hover:border-slate-700 space-y-4">
                        <div class="flex items-center justify-between border-b border-slate-800/80 pb-3 gap-3 flex-wrap">
                            <div class="flex items-center gap-2.5">
                                <span class="px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider bg-blue-500/10 text-blue-400 border border-blue-500/30">
                                    ${m.genero_display}
                                </span>
                                <h3 class="text-base sm:text-lg font-black text-white tracking-tight">${m.nome}</h3>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="px-2.5 py-1 rounded-xl text-[10px] font-bold border flex items-center gap-1.5 ${statusColor}">
                                    ${statusIcon}
                                    <span>${m.status_display}</span>
                                </span>
                                ${m.tem_chaveamento && m.chaveamento_id ? `
                                    <a href="/chaveamento/${m.chaveamento_id}/" class="px-2.5 py-1 rounded-xl text-[11px] font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 transition flex items-center gap-1" title="Ver estrutura completa">
                                        <span>Chaveamento</span>
                                        <i data-lucide="arrow-right" class="w-3 h-3"></i>
                                    </a>
                                ` : ''}
                            </div>
                        </div>

                        ${m.detalhes ? `<p class="text-[11px] text-amber-300/80 font-medium -mt-2">${m.detalhes}</p>` : ''}

                        <!-- Pódio Visual 3D da Modalidade -->
                        <div class="pt-2">
                            ${renderizarPodiumVisual(m.primeiro, m.segundo, m.terceiro, false)}
                        </div>
                    </div>
                `;
            });

            if (viewMod) viewMod.innerHTML = html;

        } else {
            // Aba Campeão Geral
            if (viewMod) viewMod.classList.add('hidden');
            if (viewGeral) viewGeral.classList.remove('hidden');

            const cg = podiumCache.campeao_geral || {};
            let ranking = cg.ranking_completo || [];

            if (termoBusca) {
                ranking = ranking.filter(r => r.nome.toLowerCase().includes(termoBusca) || (r.campus && r.campus.toLowerCase().includes(termoBusca)));
            }

            if (ranking.length === 0 && termoBusca) {
                if (viewGeral) viewGeral.innerHTML = '';
                if (emptyState) emptyState.classList.remove('hidden');
                return;
            }
            if (emptyState) emptyState.classList.add('hidden');

            let html = `
                <!-- Banner de Explicação dos Critérios -->
                <div class="bg-gradient-to-r from-amber-950/40 via-slate-900 to-indigo-950/40 border border-amber-500/30 rounded-3xl p-4 sm:p-6 text-white space-y-2">
                    <div class="flex items-center gap-2.5">
                        <div class="w-8 h-8 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center">
                            <i data-lucide="award" class="w-4 h-4"></i>
                        </div>
                        <h3 class="text-sm sm:text-base font-black tracking-tight text-amber-300">Classificação do Campeão Geral</h3>
                    </div>
                    <p class="text-xs text-slate-300 leading-relaxed">
                        O título de <strong>Campeão Geral das Olimpíadas</strong> é atribuído às delegações que mais venceram as modalidades (maior número de ouros em 1º lugar, seguido por pratas em 2º lugar e bronzes em 3º lugar).
                    </p>
                </div>

                <!-- Grande Pódio Master do Campeão Geral -->
                <div class="bg-slate-950/80 border border-slate-800 rounded-3xl p-4 sm:p-6 shadow-xl space-y-4">
                    <div class="text-center">
                        <span class="text-[10px] font-black uppercase tracking-widest text-amber-400">Pódio Geral das Olimpíadas</span>
                        <h4 class="text-base sm:text-lg font-black text-white">Delegações Campeãs Gerais</h4>
                    </div>

                    ${renderizarPodiumVisual(cg.primeiro, cg.segundo, cg.terceiro, true)}

                    ${(!cg.primeiro && !cg.segundo && !cg.terceiro) ? `
                        <div class="text-center py-2 text-slate-400 text-xs italic">
                            Aguardando a conclusão das finais para coroar as delegações campeãs gerais.
                        </div>
                    ` : ''}
                </div>

                <!-- Tabela / Quadro Geral de Medalhas -->
                <div class="bg-slate-950/80 border border-slate-800 rounded-3xl overflow-hidden shadow-lg">
                    <div class="p-4 border-b border-slate-800 flex items-center justify-between">
                        <div>
                            <h4 class="text-sm font-extrabold text-white">Quadro Geral de Medalhas</h4>
                            <span class="text-[11px] text-slate-400">Ranking ordenado pelo critério olímpico de títulos</span>
                        </div>
                        <span class="px-2.5 py-1 rounded-xl text-[10px] font-bold bg-slate-800 text-slate-300 border border-slate-700">
                            ${ranking.length} Delegações
                        </span>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-xs">
                            <thead>
                                <tr class="bg-slate-900/90 text-slate-400 border-b border-slate-800 text-[10px] font-black uppercase tracking-wider">
                                    <th class="py-3 px-3 text-center w-12">Pos</th>
                                    <th class="py-3 px-3">Delegação</th>
                                    <th class="py-3 px-3 text-center text-amber-400 font-extrabold" title="Ouros (1º Lugar)">🥇 Ouro</th>
                                    <th class="py-3 px-3 text-center text-slate-300 font-extrabold" title="Pratas (2º Lugar)">🥈 Prata</th>
                                    <th class="py-3 px-3 text-center text-amber-600 font-extrabold" title="Bronzes (3º Lugar)">🥉 Bronze</th>
                                    <th class="py-3 px-3 text-center text-white font-black" title="Total de Pódios">Total</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800/60">
            `;

            ranking.forEach(r => {
                const posBadge = r.posicao === 1 ? 'bg-amber-400 text-slate-950 font-black' : (r.posicao === 2 ? 'bg-slate-300 text-slate-950 font-black' : (r.posicao === 3 ? 'bg-amber-700 text-white font-black' : 'bg-slate-800 text-slate-400 font-bold'));
                const highlightRow = r.posicao <= 3 && r.total > 0 ? 'bg-amber-500/5' : 'hover:bg-slate-900/50';

                html += `
                    <tr class="${highlightRow} transition">
                        <td class="py-3 px-3 text-center">
                            <span class="w-6 h-6 rounded-full inline-flex items-center justify-center text-[10px] ${posBadge}">
                                ${r.posicao}º
                            </span>
                        </td>
                        <td class="py-3 px-3 font-semibold text-white">
                            <div class="flex items-center gap-2.5">
                                ${gerarAvatarHtml(r, "w-7 h-7 text-[10px]", "ring-slate-700")}
                                <div class="min-w-0">
                                    <span class="font-bold text-slate-200 block truncate">${r.nome}</span>
                                    ${r.campus ? `<span class="text-[10px] text-slate-400 block">${r.campus}</span>` : ''}
                                </div>
                            </div>
                        </td>
                        <td class="py-3 px-3 text-center font-black text-amber-400 text-sm">${r.ouros}</td>
                        <td class="py-3 px-3 text-center font-black text-slate-300 text-sm">${r.pratas}</td>
                        <td class="py-3 px-3 text-center font-black text-amber-500 text-sm">${r.bronzes}</td>
                        <td class="py-3 px-3 text-center font-black text-white text-sm bg-slate-900/40">${r.total}</td>
                    </tr>
                `;
            });

            html += `
                            </tbody>
                        </table>
                    </div>
                </div>
            `;

            if (viewGeral) viewGeral.innerHTML = html;
        }

        if (window.lucide) {
            setTimeout(() => window.lucide.createIcons(), 30);
        }
    }
})();
</script>
