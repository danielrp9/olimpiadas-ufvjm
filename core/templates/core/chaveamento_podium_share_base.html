{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pódio - Olimpíadas UFVJM{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'logo.png' %}">
    <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}?v={% now 'U' %}">
    <script src="{% static 'js/lucide.min.js' %}"></script>
    <script src="{% static 'js/lucide-init.js' %}"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .lucide, [data-lucide], svg.lucide {
            display: inline-block;
            vertical-align: -0.125em;
            stroke-width: 2px;
            pointer-events: none;
        }
        svg.lucide:not([class*="w-"]):not([class*="size-"]):not([class*="h-"]) {
            width: 1.15em;
            height: 1.15em;
        }
        @media print {
            .no-print { display: none !important; }
            body { background: #ffffff !important; color: #000000 !important; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen pb-16">
    <!-- Conteúdo Principal -->
    <main class="max-w-[1400px] mx-auto px-4 sm:px-6 pt-4 sm:pt-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Rodapé Oficial do Sistema -->
    <footer class="max-w-[1400px] mx-auto px-4 sm:px-6 no-print" style="margin-top: 64px !important; margin-bottom: 32px !important;">
        <div class="w-full bg-slate-900 border border-slate-800 rounded-3xl py-6 px-6 shadow-sm text-center space-y-3">
            <h3 class="text-sm font-bold text-white tracking-wide">
                Olimpíadas Universitárias
            </h3>
            <p class="text-xs text-slate-400 font-medium">
                Desenvolvido por <span class="text-slate-200 font-semibold">Daniel Rodrigues</span>
            </p>
            <div class="flex items-center justify-center gap-4 pt-1">
                <a href="https://www.linkedin.com/in/daniel-rodrigues-pereira-29b1b7243/" target="_blank" rel="noopener noreferrer" class="text-slate-400 hover:text-blue-400 text-lg transition-all duration-200 hover:scale-110" title="LinkedIn">
                    <i data-lucide="linkedin"></i>
                </a>
                <a href="mailto:danielrodrigues878@hotmail.com" class="text-slate-400 hover:text-amber-400 text-lg transition-all duration-200 hover:scale-110" title="E-mail">
                    <i data-lucide="mail"></i>
                </a>
            </div>
        </div>
    </footer>

    {% include 'core/includes/modal_compartilhar.html' %}
</body>
</html>
